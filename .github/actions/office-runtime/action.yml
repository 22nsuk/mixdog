name: Office runtime
description: >-
  Fonts and the LibreOffice release the Office suites render and recalculate
  with on an Ubuntu or macOS runner.
runs:
  using: composite
  steps:
    # Office audits measure text in the deck's own faces and neither runner
    # ships the Microsoft families; the metric-compatible Liberation faces
    # stand in for Arial, Times New Roman, and Courier New, and Carlito for
    # Calibri, the workbook default whose digit sizes a column
    # (src/runtime/office/portable/text-metrics.mjs). The PDF suites write
    # Hangul through NanumGothic.ttf, which heads the Linux list in
    # pdf-fonts.mjs (a .ttc collection such as Noto CJK cannot be embedded).
    #
    # Ubuntu's LibreOffice 7.3 draws the provisioned variable Noto faces at
    # their default (Thin) instance, and the rendered review then reads the
    # type as low contrast; the LibreOffice PPA's current release draws the
    # named instances the way the desktop build does. The PPA signing key
    # (CDDE43BA4DE3F09D7CE7016673AEE920AD55F5A0) ships beside this action:
    # add-apt-repository spent ~25s resolving it through the Launchpad API on
    # every run, then refreshed the package lists a second time.
    #
    # The cask downloads from download.documentfoundation.org, which has gone
    # down for hours at a time. When the cask fails, the same release comes from
    # TDF mirrors and is checked against the cask's own sha256. Every macOS
    # runner using this action is arm64 (macos-15).
    #
    # Fetching the ~350 MB disk image took ~45s of every macOS shard, the
    # gate's longest leg. The download is restored into Homebrew's own cache,
    # where brew reuses it only under the name it derives from the cask's URL
    # and still verifies the cask's sha256 before installing it.
    # The four cache steps only save time: a failure in any of them falls
    # back to the plain download below instead of failing the job.
    - name: Locate the Homebrew download cache
      id: brew-cache
      if: runner.os == 'macOS'
      continue-on-error: true
      shell: bash
      run: |
        echo "dir=$(brew --cache)/downloads" >> "$GITHUB_OUTPUT"
        echo "prefix=office-brew-downloads-v1-${RUNNER_OS}-${RUNNER_ARCH}-" >> "$GITHUB_OUTPUT"
    - name: Restore the cached LibreOffice download
      id: brew-restore
      if: runner.os == 'macOS' && steps.brew-cache.outputs.dir != ''
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.brew-cache.outputs.dir }}
        key: ${{ steps.brew-cache.outputs.prefix }}
        restore-keys: ${{ steps.brew-cache.outputs.prefix }}
    - name: Install fonts and LibreOffice
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          brew install --cask font-carlito && break
          if [ "$attempt" -eq 3 ]; then exit 1; fi
          echo "font-carlito install failed (attempt ${attempt}/3)" >&2
          sleep $((attempt * 10))
        done
        if brew install --cask libreoffice; then
          exit 0
        fi
        echo "LibreOffice cask failed; installing from a TDF mirror" >&2
        dmg=LibreOffice_26.8.0_MacOS_aarch64.dmg
        for base in https://mirrors.dotsrc.org/tdf https://ftp.kaist.ac.kr/tdf; do
          curl -fL --retry 3 --max-time 600 -o "$dmg" "$base/libreoffice/stable/26.8.0/mac/aarch64/$dmg" && break
        done
        echo "8858d8058da4f862f47559486814e65efc27294da67c5e4bb56b006b1ee59f89  $dmg" | shasum -a 256 -c -
        mount=$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F'\t' '/\/Volumes\//{print $NF}')
        cp -R "$mount/LibreOffice.app" /Applications/
        hdiutil detach "$mount"
    # Only the files the current casks download to stay in the cache, so an
    # older LibreOffice image is dropped instead of accumulating. The key
    # names that set: a new release saves a new entry, an unchanged one
    # saves nothing. (After a mirror fallback there is nothing to keep.)
    - name: Keep only the current downloads for the cache
      id: brew-keep
      if: runner.os == 'macOS' && steps.brew-cache.outputs.dir != ''
      continue-on-error: true
      shell: bash
      env:
        DOWNLOADS: ${{ steps.brew-cache.outputs.dir }}
        PREFIX: ${{ steps.brew-cache.outputs.prefix }}
      run: |
        set -euo pipefail
        keep=""
        for cask in font-carlito libreoffice; do
          file="$(brew --cache --cask "$cask")"
          if [ -f "$file" ]; then keep="${keep}$(basename "$(realpath "$file")")"$'\n'; fi
        done
        for file in "$DOWNLOADS"/*; do
          [ -e "$file" ] || continue
          if ! grep -qxF "$(basename "$file")" <<< "$keep"; then rm -rf "$file"; fi
        done
        if [ -n "$keep" ]; then
          echo "key=${PREFIX}$(printf '%s' "$keep" | sort | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
        fi
    - name: Save the LibreOffice download
      if: >-
        runner.os == 'macOS'
        && steps.brew-keep.outputs.key != ''
        && steps.brew-keep.outputs.key != steps.brew-restore.outputs.cache-matched-key
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.brew-cache.outputs.dir }}
        key: ${{ steps.brew-keep.outputs.key }}
    # The Linux install took 310-738s and the PPA answered 503 twice, so the
    # packages it downloads are cached as .deb files. The cache key is the
    # package list plus the PPA's candidate versions (apt-cache policy, after
    # refreshing only the PPA's own index) and the runner image version, which
    # fixes the set of dependencies already installed. A hit installs the
    # cached files with dpkg and no mirror; a miss, or a hit that does not
    # install cleanly, runs the network install below, which also fills the
    # cache directory for the next run.
    - name: Add the LibreOffice PPA and resolve the package cache key
      id: apt-key
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/apt-helpers.sh"
        sudo gpg --dearmor --yes -o /usr/share/keyrings/libreoffice-ppa.gpg "$GITHUB_ACTION_PATH/libreoffice-ppa.asc"
        echo "deb [signed-by=/usr/share/keyrings/libreoffice-ppa.gpg] https://ppa.launchpadcontent.net/libreoffice/ppa/ubuntu $(lsb_release -cs) main" \
          | sudo tee /etc/apt/sources.list.d/libreoffice-ppa.list > /dev/null
        # man-db re-indexes every installed manual page afterwards (~11s);
        # nothing on a CI runner reads them.
        sudo rm -f /var/lib/man-db/auto-update
        if apt_retry 120 update -qq -o Dir::Etc::sourcelist=sources.list.d/libreoffice-ppa.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0; then
          candidates=$(apt-cache policy libreoffice-writer libreoffice-impress libreoffice-calc \
            | awk '/^[^ ]/ { name = $1 } /Candidate:/ { print name "=" $2 }')
          if [ -n "$candidates" ] && ! grep -q '=(none)$' <<< "$candidates"; then
            hash=$(printf '%s\n%s\n%s\n%s\n' "$(tr ' ' '\n' <<< "$OFFICE_APT_PACKAGES" | sort)" "$candidates" "$(lsb_release -cs)" "${ImageVersion:-}" | sha256sum | cut -c1-32)
            echo "key=office-debs-v1-${RUNNER_ARCH}-${hash}" >> "$GITHUB_OUTPUT"
          fi
        fi
    - name: Restore the cached Office packages
      id: apt-cache
      if: runner.os == 'Linux' && steps.apt-key.outputs.key != ''
      continue-on-error: true
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/office-debs
        key: ${{ steps.apt-key.outputs.key }}
    - name: Install fonts and LibreOffice
      if: runner.os == 'Linux'
      shell: bash
      env:
        DEBS: ${{ runner.temp }}/office-debs
        CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/apt-helpers.sh"
        if [ "$CACHE_HIT" = true ] && compgen -G "$DEBS/*.deb" > /dev/null; then
          if sudo env DEBIAN_FRONTEND=noninteractive dpkg -i "$DEBS"/*.deb; then
            exit 0
          fi
          echo "cached packages did not install; falling back to the network install" >&2
        fi
        mkdir -p "$DEBS"
        sudo mkdir -p "$DEBS/partial"
        apt_retry 120 update -qq
        # Download first so the files land in the cache directory even if the
        # install step fails; the install then reuses them without a fetch.
        apt_retry 480 install -y -qq --no-install-recommends --download-only -o Dir::Cache::archives="$DEBS" -o APT::Keep-Downloaded-Packages=true $OFFICE_APT_PACKAGES
        apt_retry 480 install -y -qq --no-install-recommends -o Dir::Cache::archives="$DEBS" -o APT::Keep-Downloaded-Packages=true $OFFICE_APT_PACKAGES
        # apt ran as root: leave only files the cache action (the runner user)
        # can read.
        sudo rm -rf "$DEBS/partial" "$DEBS/lock"
        sudo chown -R "$(id -u):$(id -g)" "$DEBS"
    # Decks author in Noto Sans, Noto Sans KR and Noto Sans JP, and a Latin
    # face's Hangul measures in Noto Sans KR where Malgun Gothic is missing.
    # The runtime's own provisioner installs them into the user font directory,
    # as it does for a user, so audits and the rendered review see the faces a
    # document declares. The faces are downloaded, so a failed run is retried;
    # one that keeps failing still fails the step.
    - name: Provision the Office Noto fonts
      shell: bash
      run: |
        provision() {
          node --input-type=module <<'NODE'
        import { NOTO_FONT_DEFINITIONS, prepareOfficeFonts } from './src/runtime/office/portable/font-provisioner.mjs';
        const ids = new Set(['noto-sans-latin', 'noto-sans-kr', 'noto-sans-jp']);
        const results = await prepareOfficeFonts({ targets: NOTO_FONT_DEFINITIONS.filter((font) => ids.has(font.id)) });
        console.log(JSON.stringify(results, null, 2));
        if (!Object.values(results).every((font) => font.installed)) process.exit(1);
        NODE
        }
        for attempt in 1 2 3; do
          provision && exit 0
          echo "Noto font provisioning failed (attempt ${attempt}/3)" >&2
          sleep $((attempt * 10))
        done
        exit 1
