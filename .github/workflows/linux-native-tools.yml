# Builds mixdog-computer, mixdog-graph and mixdog-patch inside manylinux_2_28
# (glibc 2.28) so the native tools' floor does not follow the glibc of the CI
# runner. (The packaged Linux app's overall floor is glibc 2.31, set by the
# runtime built on ubuntu:20.04.) Called by the release workflow (once per
# run) and by standalone linux-desktop-verify runs; the artifact name is
# unique per run, so never call this twice in one run with upload_artifact
# left on. Deploy also calls it with upload_artifact: false right after a
# native version bump, only to warm the per-tool caches the release's own call
# then hits. Consumers download the native-tools-glibc228-<arch> artifact and point
# MIXDOG_NATIVE_TOOLS_OVERRIDE_DIR / MIXDOG_COMPUTER_NATIVE_BIN at it.
name: linux-native-tools

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit SHA to build (defaults to the caller's github.sha)"
        required: false
        type: string
        default: ""
      upload_artifact:
        description: "Upload native-tools-glibc228-<arch>; false only warms the tool caches (the name is unique per run, so a second upload in one run would fail)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: native-tools-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x64, image: "quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae" }
          - { runner: ubuntu-24.04-arm, arch: arm64, image: "quay.io/pypa/manylinux_2_28_aarch64@sha256:abd1230aa9e4058a74b89d27cd14ba18c0db036d7bfe6e6f219a29ea63c24eb6" }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/assert-sha
        with:
          expected: ${{ inputs.ref || github.sha }}
      # One exact-key cache per tool (no restore-keys: a prefix hit would ship a
      # binary built from other sources). A tool's key follows its own crate,
      # the build script and the digest-pinned build image, so a change to one
      # tool rebuilds just that tool and a new image rebuilds all. Release cargo target dirs are deliberately not cached.
      - name: Cache built mixdog-computer
        id: cache-computer
        uses: actions/cache@v4
        with:
          path: native-out/mixdog-computer
          key: native-glibc228-${{ matrix.arch }}-computer-${{ matrix.image }}-${{ hashFiles('native/mixdog-computer/**', 'apps/desktop/scripts/linux-build-native-old-glibc.sh') }}
      - name: Cache built mixdog-graph
        id: cache-graph
        uses: actions/cache@v4
        with:
          path: native-out/mixdog-graph
          key: native-glibc228-${{ matrix.arch }}-graph-${{ matrix.image }}-${{ hashFiles('native/mixdog-graph/**', 'apps/desktop/scripts/linux-build-native-old-glibc.sh') }}
      - name: Cache built mixdog-patch
        id: cache-patch
        uses: actions/cache@v4
        with:
          path: native-out/mixdog-patch
          key: native-glibc228-${{ matrix.arch }}-patch-${{ matrix.image }}-${{ hashFiles('native/mixdog-patch/**', 'apps/desktop/scripts/linux-build-native-old-glibc.sh') }}
      - name: Select the tools that missed their cache
        id: missing
        env:
          HIT_COMPUTER: ${{ steps.cache-computer.outputs.cache-hit }}
          HIT_GRAPH: ${{ steps.cache-graph.outputs.cache-hit }}
          HIT_PATCH: ${{ steps.cache-patch.outputs.cache-hit }}
        run: |
          missing=()
          [[ "$HIT_COMPUTER" == true ]] || missing+=(computer)
          [[ "$HIT_GRAPH" == true ]] || missing+=(graph)
          [[ "$HIT_PATCH" == true ]] || missing+=(patch)
          echo "tools=${missing[*]}" >> "$GITHUB_OUTPUT"
      - name: Build the missing tools concurrently (glibc 2.28)
        if: steps.missing.outputs.tools != ''
        run: |
          mkdir -p native-out
          docker run --rm -e MIXDOG_NATIVE_TOOLS="${{ steps.missing.outputs.tools }}" -v "$PWD:/w" ${{ matrix.image }} bash /w/apps/desktop/scripts/linux-build-native-old-glibc.sh 2>&1 | tee native-out/build.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Require all three tools
        run: |
          for tool in computer graph patch; do
            test -f "native-out/mixdog-$tool"
          done
      - uses: actions/upload-artifact@v5
        if: inputs.upload_artifact
        with:
          name: native-tools-glibc228-${{ matrix.arch }}
          path: native-out/
          if-no-files-found: error