name: Raw Read Follow-up Validation
on:
  push:
    branches: [validation/raw-read-poststat-20261011]
    paths: [.github/workflows/raw-read-validation.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 5046987dcbbb8275890a30baebc0360e19917c09
          persist-credentials: false
      - name: Archive reviewed text sources only
        shell: python
        run: |
          import pathlib, subprocess, zipfile
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile('raw-read-source.zip', 'w', zipfile.ZIP_DEFLATED) as out:
              for file in files:
                  path = pathlib.Path(file)
                  if file.startswith(('src/', 'scripts/')) and path.suffix in ('.mjs', '.js', '.json') or file in ('package.json', 'package-lock.json'):
                      out.write(path, file)
              out.writestr('REVIEW_SOURCE_SHA', subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode())
      - uses: actions/upload-artifact@v4
        with:
          name: raw-read-source
          path: raw-read-source.zip
          retention-days: 3
