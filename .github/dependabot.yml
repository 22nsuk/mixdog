# Continuous dependency updates (issue #159). Patch and minor updates arrive as
# one grouped pull request per directory each week; semver-major updates are
# ignored here and handled by hand. The root manifest is what ships inside
# runtime.asar; apps/desktop carries the Electron app and its native node-pty.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      root-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      desktop-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # @tiptap/extension-mathematics peers katex up to 0.18 only.
      - dependency-name: "katex"
        versions: [">=0.19.0"]
      # Pinned: transcript-list-virtualizer.ts patches virtual-core internals.
      - dependency-name: "@tanstack/virtual-core"
      - dependency-name: "@tanstack/react-virtual"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
