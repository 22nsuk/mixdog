<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mixdog · 띵킹 스피너 아이콘 시안 v2</title>
<style>
  /* Theme containers: the page body and each comparison panel carry .t plus
     one theme, so dark and light can render side by side. */
  .theme-dark {
    color-scheme:dark;
    --page:#111113; --band:#222225; --card:#2a2a2d;
    --text:#e9e9e9; --muted:#a8a8a8; --accent:#79b8ff;
    --border:rgba(255,255,255,.125); --line:rgba(255,255,255,.09); --hover:rgba(255,255,255,.08);
    --n-ink:#9d9da3; --n-head:#f4f4f5;
    --b-ink:#9d9da3; --b-head:#8cc2ff;
    --a-ink:#9fb0d4; --a-head:url(#aurora-d);
    --ti-ink:#8f9db2; --ti-head:url(#ti-d);
  }
  .theme-light {
    color-scheme:light;
    --page:#f8f8fb; --band:#ffffff; --card:#f3f3f3;
    --text:#222222; --muted:#606060; --accent:#185abc;
    --border:rgba(23,24,26,.14); --line:rgba(23,24,26,.1); --hover:rgba(0,0,0,.06);
    --n-ink:#6b6b71; --n-head:#18181b;
    --b-ink:#6b6b71; --b-head:#1a5fd0;
    --a-ink:#56658c; --a-head:url(#aurora-l);
    --ti-ink:#5b6b82; --ti-head:url(#ti-l);
  }
  body[data-color="neutral"] .t, body[data-color="neutral"].t { --ink:var(--n-ink); --head:var(--n-head); }
  body[data-color="blue"] .t, body[data-color="blue"].t { --ink:var(--b-ink); --head:var(--b-head); }
  body[data-color="aurora"] .t, body[data-color="aurora"].t { --ink:var(--a-ink); --head:var(--a-head); }
  body[data-color="titanium"] .t, body[data-color="titanium"].t { --ink:var(--ti-ink); --head:var(--ti-head); }
  :root { --k:1; --glyph:14px; --sans:"Pretendard Variable",Pretendard,"Malgun Gothic","Segoe UI",sans-serif; }
  body.paused *, body.paused *::after { animation-play-state:paused !important; }

  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--text); font:14px/20px var(--sans); }
  h1,h2,p { margin:0; }
  button { font:inherit; color:var(--muted); cursor:pointer; border:0; border-radius:6px; background:transparent; padding:4px 12px; }
  button:hover { background:var(--hover); }
  button[aria-pressed="true"] { background:var(--card); color:var(--text); box-shadow:0 1px 4px #0002; }
  svg { display:block; overflow:visible; }
  .defs { position:absolute; width:0; height:0; }
  .page { max-width:1440px; margin:auto; padding:30px 32px 60px; }
  h1 { font-size:20px; font-weight:600; letter-spacing:-.3px; }
  .intro { color:var(--muted); margin-top:4px; font-size:13px; }
  .toolbar { display:flex; flex-wrap:wrap; gap:18px; align-items:center; margin:20px 0 24px; }
  .control { display:flex; align-items:center; gap:9px; }
  .control-label { color:var(--muted); font-size:13px; }
  .segments { display:flex; gap:3px; padding:3px; border-radius:8px; background:var(--band); border:1px solid var(--line); }
  .swatch { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .section-title { font-size:13px; font-weight:550; color:var(--muted); margin:0 0 10px; }

  /* Real-size comparison: both themes at once. */
  .duo { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:30px; }
  .panel { border:1px solid var(--border); border-radius:12px; background:var(--page); color:var(--text); padding:12px 20px 14px; }
  .panel-label { font-size:11px; color:var(--muted); margin-bottom:6px; }
  .rows { display:grid; grid-template-columns:1fr 1fr; gap:4px 20px; }
  .row { display:flex; align-items:center; gap:10px; }
  .row .num { width:14px; color:var(--muted); font-size:11px; text-align:right; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(400px,100%),1fr)); gap:20px; }
  @media (max-width:1100px) { body .duo { grid-template-columns:1fr; } }
  @media (max-width:640px) {
    body .page { padding:20px 14px 40px; }
    body .rows { grid-template-columns:1fr; }
    body .stage { grid-template-columns:1fr; }
    body .size-boxes { justify-content:space-around; }
  }
  .card { border:1px solid var(--border); border-radius:12px; background:var(--band); overflow:hidden; display:flex; flex-direction:column; }
  .card.current { opacity:.85; }
  .card-head { display:flex; align-items:center; gap:10px; padding:14px 16px 10px; }
  .letter { width:22px; height:22px; display:grid; place-items:center; border:1px solid var(--border); border-radius:6px; font-size:11px; flex:none; }
  .card:not(.current) .letter { border-color:var(--accent); color:var(--accent); }
  .card-head h2 { font-size:14px; font-weight:600; }
  .tag { margin-left:auto; font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:0 8px; }
  .stage { display:grid; grid-template-columns:132px 1fr; gap:14px; padding:0 16px; }
  .hero { height:132px; display:grid; place-items:center; background:var(--page); border-radius:10px; border:1px solid var(--line); }
  .hero svg { width:72px; height:72px; }
  .sizes { display:flex; flex-direction:column; justify-content:space-between; gap:8px; }
  .size-boxes { display:flex; align-items:end; gap:16px; padding:10px 12px; background:var(--page); border-radius:10px; border:1px solid var(--line); }
  .size-boxes figure { margin:0; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .size-boxes figcaption { font-size:10px; color:var(--muted); }
  .transcript { padding:10px 12px; background:var(--page); border-radius:10px; border:1px solid var(--line); }
  .desc { padding:12px 16px 4px; font-size:13px; }
  .notes { margin:6px 16px 16px; padding:0 0 0 16px; color:var(--muted); font-size:12px; line-height:18px; }

  /* Live band, mirroring 14-live-activity.css + the 22-markdown.css comet. */
  .live { width:max-content; max-width:100%; min-height:24px; display:flex; align-items:center; gap:7px; color:var(--muted); }
  .live-icon { width:16px; height:20px; flex:0 0 16px; display:grid; place-items:center; line-height:0; }
  .live-icon svg { width:var(--glyph); height:var(--glyph); }
  .verb { position:relative; font-weight:500; --cells:8; }
  .verb::after {
    content:attr(data-text); position:absolute; inset:0; pointer-events:none; color:transparent;
    background:linear-gradient(90deg,transparent 0%,color-mix(in oklch,var(--accent) 35%,transparent) 25%,color-mix(in oklch,var(--accent) 22%,white) 50%,color-mix(in oklch,var(--accent) 35%,transparent) 75%,transparent 100%) 0 0 / 4ch 100% no-repeat;
    background-clip:text; -webkit-background-clip:text;
    animation:comet calc((var(--cells) + 7) * 100ms * var(--k)) linear infinite;
  }
  @keyframes comet { from { background-position:-4ch 0; } to { background-position:calc(100% + 7ch) 0; } }
  .meta { font-weight:400; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .meta::before { content:"\00B7"; margin-right:7px; }

  /* ---------- Glyphs (24-unit grid; strokes sized for 14px = 1.75px) ---------- */
  .o { transform-box:view-box; transform-origin:12px 12px; }
  .fb { transform-box:fill-box; transform-origin:center; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .arc { fill:none; stroke:var(--head); stroke-width:3; stroke-linecap:round; }

  /* 0 — current rhombus (verbatim from 14-live-activity.css, muted ink) */
  .c0-spin { transform-box:fill-box; transform-origin:50% 50%; animation:spin90 calc(var(--k)*2900ms) linear infinite; }
  .c0-ring { fill:none; stroke:var(--muted); stroke-width:1.25; stroke-linejoin:miter; }
  .c0-core { fill:var(--muted); transform-box:fill-box; transform-origin:50% 50%; animation:c0core calc(var(--k)*1300ms) cubic-bezier(.4,0,.6,1) infinite; }
  @keyframes spin90 { to { transform:rotate(90deg); } }
  @keyframes c0core { 0%,100% { transform:scale(.12); opacity:.35; } 32%,68% { transform:scale(.58); opacity:.72; } 50% { transform:scale(1); opacity:1; } }

  /* 1 — Logo orbit: three arcs chase and breathe, never shorter than a stroke */
  .c1-spin { animation:spin calc(var(--k)*2400ms) linear infinite; }
  .c1-arc { animation:c1breathe calc(var(--k)*1800ms) cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes c1breathe {
    0% { stroke-dasharray:6 9.917; stroke-dashoffset:0; }
    50% { stroke-dasharray:11 4.917; stroke-dashoffset:-4; }
    100% { stroke-dasharray:6 9.917; stroke-dashoffset:-15.917; }
  }
  .c1-star { fill:var(--head); animation:c1star calc(var(--k)*1800ms) cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes c1star { 0% { transform:scale(.85) rotate(0); } 50% { transform:scale(1.1) rotate(45deg); } 100% { transform:scale(.85) rotate(90deg); } }

  /* 2 — Logo step: the exact mark, turned a third at a time */
  .c2-arc { stroke-dasharray:10 5.917; }
  .c2-step { animation:c2step calc(var(--k)*1500ms) infinite; }
  @keyframes c2step { 0% { transform:rotate(0); animation-timing-function:cubic-bezier(.65,0,.35,1); } 55%,100% { transform:rotate(120deg); } }
  .c2-pulse { animation:c2pulse calc(var(--k)*1500ms) ease-in-out infinite; }
  @keyframes c2pulse { 0%,55%,100% { transform:scale(1); } 27% { transform:scale(.86); } }
  .c2-star { fill:var(--head); animation:c2star calc(var(--k)*1500ms) infinite; }
  @keyframes c2star {
    0% { transform:rotate(0) scale(1); animation-timing-function:cubic-bezier(.65,0,.35,1); }
    55%,100% { transform:rotate(-90deg) scale(1); }
  }

  /* 3 — Sparkle: full-armed star, one companion glint */
  .c3-main { fill:var(--head); animation:c3main calc(var(--k)*2600ms) cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes c3main { 0% { transform:scale(.86) rotate(0); } 50% { transform:scale(1) rotate(45deg); } 100% { transform:scale(.86) rotate(90deg); } }
  .c3-sat { fill:var(--head); opacity:0; animation:c3sat calc(var(--k)*2600ms) ease-in-out infinite; }
  .c3-sat.b { animation-delay:calc(var(--k)*-1300ms); }
  @keyframes c3sat { 0%,60%,100% { opacity:0; transform:scale(.3); } 30% { opacity:1; transform:scale(1); } }

  /* 4 — Comet: solid track, tapered tail, no ghost-level opacity */
  .c4-track { fill:none; stroke:var(--ink); stroke-width:2; opacity:.4; }
  .c4-orbit { animation:spin calc(var(--k)*1100ms) cubic-bezier(.5,.15,.5,.85) infinite; }
  .c4-t { fill:none; stroke:var(--head); stroke-width:3; }
  .c4-t3 { opacity:.35; stroke-dasharray:18 32.265; }
  .c4-t2 { opacity:.65; stroke-dasharray:11 39.265; stroke-dashoffset:-7; }
  .c4-t1 { stroke-linecap:round; stroke-dasharray:5 45.265; stroke-dashoffset:-13; }
  .c4-core { fill:var(--head); animation:c4core calc(var(--k)*2200ms) ease-in-out infinite; }
  @keyframes c4core { 0%,100% { transform:scale(.8); } 50% { transform:scale(1.15); } }

  /* 5 — Diamond dots: lit overlay travels clockwise over solid base dots */
  .c5-dot { fill:var(--ink); }
  .c5-lit { fill:var(--head); opacity:0; animation:c5lit calc(var(--k)*1200ms) ease-out infinite; }
  .c5-lit.r { animation-delay:calc(var(--k)*-900ms); }
  .c5-lit.b { animation-delay:calc(var(--k)*-600ms); }
  .c5-lit.l { animation-delay:calc(var(--k)*-300ms); }
  @keyframes c5lit { 0% { opacity:1; transform:scale(1.25); } 50%,100% { opacity:0; transform:scale(.9); } }
  .c5-core { fill:var(--head); animation:c5core calc(var(--k)*1200ms) cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes c5core { 0% { transform:rotate(0) scale(.85); } 50% { transform:rotate(45deg) scale(1.1); } 100% { transform:rotate(90deg) scale(.85); } }

  /* 6 — Logo draw: arcs draw in and withdraw; the star always remains */
  .c6-rot { animation:spin calc(var(--k)*6000ms) linear infinite; }
  /* A zero-length dash with a round cap is a dot: the arcs rest as three
     dots instead of vanishing, so the band always shows a mark. */
  .c6-arc { stroke-dasharray:0 47.75; animation:c6draw calc(var(--k)*2000ms) cubic-bezier(.45,0,.55,1) infinite; }
  .c6-arc.b { animation-delay:calc(var(--k)*150ms); }
  .c6-arc.c { animation-delay:calc(var(--k)*300ms); }
  @keyframes c6draw {
    0%,8% { stroke-dasharray:0 47.75; }
    35%,60% { stroke-dasharray:10 37.75; }
    90%,100% { stroke-dasharray:0 47.75; }
  }
  .c6-star { fill:var(--head); animation:c6star calc(var(--k)*2000ms) cubic-bezier(.34,1.4,.64,1) infinite; }
  @keyframes c6star { 0%,20% { transform:scale(.85) rotate(-90deg); } 45%,70% { transform:scale(1.15) rotate(0); } 95%,100% { transform:scale(.85) rotate(90deg); } }
</style>
</head>
<body class="t theme-dark" data-color="aurora">
<svg class="defs" aria-hidden="true">
  <defs>
    <linearGradient id="aurora-d" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fc0ff"/><stop offset="1" stop-color="#c3a6ff"/></linearGradient>
    <linearGradient id="aurora-l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d63e0"/><stop offset="1" stop-color="#7140d8"/></linearGradient>
    <linearGradient id="ti-d" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#9fb0c8"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="ti-l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset=".5" stop-color="#64748b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
  </defs>
</svg>
<div class="page">
  <h1>띵킹 스피너 아이콘 시안 v2</h1>
  <p class="intro">선 두께를 14px 기준 1.75px로 올리고, 반투명으로 사라지는 부분을 없앴습니다. 위쪽 비교 칸에서 다크·라이트를 실제 크기로 동시에 보실 수 있습니다. 0번(현재)은 비교용이라 색 설정을 따르지 않습니다.</p>

  <div class="toolbar">
    <div class="control"><span class="control-label">색감</span>
      <div class="segments" data-group="color">
        <button data-v="neutral"><span class="swatch" style="background:#f4f4f5;border:1px solid #888"></span>선명 뉴트럴</button>
        <button data-v="blue"><span class="swatch" style="background:#8cc2ff"></span>블루</button>
        <button data-v="aurora" aria-pressed="true"><span class="swatch" style="background:linear-gradient(135deg,#7fc0ff,#c3a6ff)"></span>오로라</button>
        <button data-v="titanium"><span class="swatch" style="background:linear-gradient(135deg,#fff,#9fb0c8,#fff);border:1px solid #888"></span>타이타늄</button>
      </div></div>
    <div class="control"><span class="control-label">상세 테마</span>
      <div class="segments" data-group="theme"><button data-v="dark" aria-pressed="true">다크</button><button data-v="light">라이트</button></div></div>
    <div class="control"><span class="control-label">실사용 크기</span>
      <div class="segments" data-group="glyph"><button data-v="12px">12px(현재)</button><button data-v="14px" aria-pressed="true">14px</button><button data-v="16px">16px</button></div></div>
    <div class="control"><span class="control-label">속도</span>
      <div class="segments" data-group="speed"><button data-v="1.6">느리게</button><button data-v="1" aria-pressed="true">기본</button><button data-v="0.6">빠르게</button></div></div>
    <div class="control"><div class="segments" data-group="pause"><button data-v="pause">일시정지</button></div></div>
  </div>

  <p class="section-title">실제 크기 · 다크와 라이트 동시 비교</p>
  <div class="duo">
    <div class="panel t theme-dark"><p class="panel-label">다크</p><div class="rows" data-rows></div></div>
    <div class="panel t theme-light"><p class="panel-label">라이트</p><div class="rows" data-rows></div></div>
  </div>

  <p class="section-title">시안별 상세</p>
  <div class="grid" id="grid"></div>
</div>

<script>
  const STAR = 'M12 8.2 13.19 10.81 15.8 12 13.19 13.19 12 15.8 10.81 13.19 8.2 12 10.81 10.81Z';
  const ARC = (cls, rot = -100) => `<circle class="arc ${cls}" cx="12" cy="12" r="7.6" transform="rotate(${rot} 12 12)"/>`;
  const candidates = [
    { id: 0, name: '현재 · 마름모', tag: '비교 기준', current: true,
      svg: `<svg viewBox="0 0 12 12"><g class="c0-spin"><path class="c0-ring" d="M6 .9 11.1 6 6 11.1.9 6Z"/><path class="c0-core" d="M6 .9 11.1 6 6 11.1.9 6Z"/></g></svg>`,
      desc: '지금 쓰는 아이콘입니다. 선이 1px 아래로 얇고, 가운데가 35% 투명도까지 흐려집니다.',
      notes: ['12px에서는 형태보다 깜빡임으로 보입니다.'] },
    { id: 1, name: '로고 오빗', tag: '로고 · 추천',
      svg: `<svg viewBox="0 0 24 24"><g class="o c1-spin">${ARC('c1-arc')}</g><path class="o c1-star" d="${STAR}"/></svg>`,
      desc: '로고의 원호 3개가 돌면서 숨 쉬듯 길이가 바뀌고, 가운데 별이 천천히 돕니다. 원호는 가장 짧을 때도 선 두께의 두 배 이상이라 점처럼 흩어지지 않습니다.',
      notes: ['그라데이션이 원호를 따라 돌아서 작은 크기에서도 반짝임이 보입니다.', '브랜드와 바로 연결되면서 스피너 역할이 분명합니다.'] },
    { id: 2, name: '로고 스텝', tag: '로고',
      svg: `<svg viewBox="0 0 24 24"><g class="o c2-step"><g class="o c2-pulse">${ARC('c2-arc')}</g></g><path class="o c2-star" d="${STAR}"/></svg>`,
      desc: '로고 모양 그대로 120°씩 부드럽게 넘어가고, 넘어갈 때 살짝 오므라듭니다. 별은 반대 방향으로 돕니다.',
      notes: ['멈출 때마다 정확한 로고가 보여 가장 단정합니다.', '움직임이 절제되어 있어 오래 봐도 피로하지 않습니다.'] },
    { id: 3, name: '스파클', tag: 'AI 관례',
      svg: `<svg viewBox="0 0 24 24"><path class="o c3-main" d="M12 3.5C12.5 9.2 14.8 11.5 20.5 12 14.8 12.5 12.5 14.8 12 20.5 11.5 14.8 9.2 12.5 3.5 12 9.2 11.5 11.5 9.2 12 3.5Z"/><path class="fb c3-sat" d="M19.5 1.9Q19.85 4.15 22.1 4.5 19.85 4.85 19.5 7.1 19.15 4.85 16.9 4.5 19.15 4.15 19.5 1.9Z"/><path class="fb c3-sat b" d="M4.5 17.3Q4.75 19.25 6.7 19.5 4.75 19.75 4.5 21.7 4.25 19.75 2.3 19.5 4.25 19.25 4.5 17.3Z"/></svg>`,
      desc: '팔을 두툼하게 다듬은 4각 별이 천천히 돌며 커졌다 작아지고, 모서리에서 작은 별이 번갈아 반짝입니다.',
      notes: ['면으로 채운 모양이라 12px에서도 가장 또렷합니다.', '흔한 모양이라 개성은 약합니다.'] },
    { id: 4, name: '혜성 궤도', tag: '반짝임과 짝',
      svg: `<svg viewBox="0 0 24 24"><circle class="c4-track" cx="12" cy="12" r="8"/><g class="o c4-orbit"><g transform="rotate(-90 12 12)"><circle class="c4-t c4-t3" cx="12" cy="12" r="8"/><circle class="c4-t c4-t2" cx="12" cy="12" r="8"/><circle class="c4-t c4-t1" cx="12" cy="12" r="8"/></g></g><circle class="fb c4-core" cx="12" cy="12" r="2"/></svg>`,
      desc: '궤도를 또렷하게 보이게 하고, 꼬리가 단계적으로 짙어지는 빛이 돕니다. 가운데 점이 천천히 숨 쉽니다.',
      notes: ['옆 글자 위를 지나는 반짝임과 같은 느낌이라 줄 전체가 하나로 보입니다.', '평범한 로딩 스피너처럼 보일 수 있습니다.'] },
    { id: 5, name: '다이아 도트', tag: '현재 계승',
      svg: `<svg viewBox="0 0 24 24"><circle class="c5-dot" cx="12" cy="3.6" r="2.3"/><circle class="c5-dot" cx="20.4" cy="12" r="2.3"/><circle class="c5-dot" cx="12" cy="20.4" r="2.3"/><circle class="c5-dot" cx="3.6" cy="12" r="2.3"/><circle class="fb c5-lit" cx="12" cy="3.6" r="2.3"/><circle class="fb c5-lit r" cx="20.4" cy="12" r="2.3"/><circle class="fb c5-lit b" cx="12" cy="20.4" r="2.3"/><circle class="fb c5-lit l" cx="3.6" cy="12" r="2.3"/><path class="o c5-core" d="M12 9.2 14.8 12 12 14.8 9.2 12Z"/></svg>`,
      desc: '마름모 꼭짓점의 점 4개는 항상 보이고, 그 위로 밝은 빛이 시계 방향으로 돕니다. 가운데 마름모가 함께 돕니다.',
      notes: ['지금의 정체성을 이어 가면서 훨씬 또렷합니다.', '완료 표시(◈)와 모양이 자연스럽게 이어집니다.'] },
    { id: 6, name: '로고 드로잉', tag: '로고 · 연출',
      svg: `<svg viewBox="0 0 24 24"><g class="o c6-rot">${ARC('c6-arc', -100)}${ARC('c6-arc b', 20)}${ARC('c6-arc c', 140)}</g><path class="o c6-star" d="${STAR}"/></svg>`,
      desc: '점 3개에서 원호가 차례로 자라나 로고가 완성되고, 다시 점으로 돌아갑니다. 별은 항상 남아 있습니다.',
      notes: ['브랜드 인상이 가장 강합니다.', '한 주기가 2초라 긴 작업에서는 반복이 눈에 띌 수 있습니다.'] },
  ];

  const live = (c) => `<div class="live"><span class="live-icon">${c.svg}</span><span class="verb" data-text="Thinking">Thinking</span><span class="meta">12s · 1.2k tokens</span></div>`;

  document.querySelectorAll('[data-rows]').forEach((rows) => {
    rows.innerHTML = candidates.map((c) => `<div class="row"><span class="num">${c.id}</span>${live(c)}</div>`).join('');
  });

  document.getElementById('grid').innerHTML = candidates.map((c) => `
    <article class="card${c.current ? ' current' : ''}">
      <div class="card-head"><span class="letter">${c.id}</span><h2>${c.name}</h2><span class="tag">${c.tag}</span></div>
      <div class="stage">
        <div class="hero">${c.svg}</div>
        <div class="sizes">
          <div class="size-boxes">
            ${[32, 24, 16, 12].map((s) => `<figure><span style="width:${s}px;height:${s}px;display:block">${c.svg.replace('<svg', `<svg width="${s}" height="${s}"`)}</span><figcaption>${s}px</figcaption></figure>`).join('')}
          </div>
          <div class="transcript">${live(c)}</div>
        </div>
      </div>
      <p class="desc">${c.desc}</p>
      <ul class="notes">${c.notes.map((n) => `<li>${n}</li>`).join('')}</ul>
    </article>`).join('');

  document.querySelectorAll('.segments').forEach((group) => {
    group.addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;
      const kind = group.dataset.group;
      const value = button.dataset.v;
      if (kind === 'pause') {
        const on = button.getAttribute('aria-pressed') !== 'true';
        button.setAttribute('aria-pressed', String(on));
        document.body.classList.toggle('paused', on);
        return;
      }
      group.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
      if (kind === 'theme') {
        document.body.classList.toggle('theme-light', value === 'light');
        document.body.classList.toggle('theme-dark', value === 'dark');
      }
      if (kind === 'color') document.body.dataset.color = value;
      if (kind === 'glyph') document.documentElement.style.setProperty('--glyph', value);
      if (kind === 'speed') document.documentElement.style.setProperty('--k', value);
    });
  });
</script>
</body>
</html>
